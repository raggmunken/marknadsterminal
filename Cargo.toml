[workspace]
resolver = "2"
members = [
    "crates/term-core",
    "crates/term-ingest",
    "crates/term-parse",
    "crates/term-extract",
    "crates/term-resolve",
    "crates/term-store",
    "crates/term-signal",
    "crates/term-api",
    "crates/term-ui",
    "crates/term-cli",
]
# `cargo test` and `cargo build` leave the interface out, because the egui
# stack takes minutes to build. Use `--workspace` to include it.
default-members = [
    "crates/term-core",
    "crates/term-ingest",
    "crates/term-parse",
    "crates/term-extract",
    "crates/term-resolve",
    "crates/term-store",
    "crates/term-signal",
    "crates/term-api",
    "crates/term-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
term-core = { path = "crates/term-core" }
term-ingest = { path = "crates/term-ingest" }
term-parse = { path = "crates/term-parse" }
term-extract = { path = "crates/term-extract" }
term-resolve = { path = "crates/term-resolve" }
term-store = { path = "crates/term-store" }
term-signal = { path = "crates/term-signal" }
term-api = { path = "crates/term-api" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
eframe = "0.36"
egui_dock = "0.21"
egui_graphs = "0.32"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.11"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
